spring.application.name=backend

# --- Pose "cloud tier" (DJL + ONNX Runtime) ---------------------------------
# Filesystem path to the MoveNet ONNX model. Not committed to git (like every
# model artifact); produce it with scripts/convert-movenet-onnx.sh, which
# converts the tflite the browser uses into the same-architecture ONNX graph.
# Default is relative to the backend working dir in dev (`cd backend && gradlew
# bootRun`); PoseInferenceService also tries the repo-root-relative location so
# `java -jar backend/build/libs/app.jar` from the checkout root just works.
# Override with APP_POSE_MODEL_PATH anywhere else (e.g. the stage box).
app.pose.model-path=${APP_POSE_MODEL_PATH:../frontend/public/models/pose/movenet-singlepose-lightning.onnx}

# Multipart limits — a single 640x480 JPEG frame is well under 1 MB, but leave
# headroom. Reject anything larger with a clear 4xx instead of buffering it.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
